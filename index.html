<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket Pilots</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>✈️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <button id="mute-btn" title="Mute / unmute">🔊</button>

    <!-- TITLE -->
    <div id="screen-title" class="screen">
      <div class="title-card plate riveted">
        <div class="title-wings">✦</div>
        <h1>Pocket Pilots</h1>
        <p>Pocket Sized WWI Dogfights</p>
        <button id="title-fight" class="btn btn-primary">Fight!</button>
      </div>
    </div>

    <!-- PLANE SELECT -->
    <div id="screen-select" class="screen">
      <div class="select-head"><h2>Choose your fighter</h2></div>
      <div class="select-main">
        <div class="roster plate">
          <div class="roster-group">
            <h3>Allied</h3>
            <div id="roster-allied" class="roster-list"></div>
          </div>
          <div class="roster-group">
            <h3>Central Powers</h3>
            <div id="roster-central" class="roster-list"></div>
          </div>
        </div>
        <div class="detail plate">
          <div id="detail-name" class="detail-name">—</div>
          <div id="detail-nation" class="detail-nation">—</div>
          <div id="detail-role" class="detail-role">—</div>
          <div id="detail-dials" class="detail-dials"></div>
        </div>
      </div>
      <div class="select-actions">
        <button id="select-back" class="btn btn-secondary">◀ Back</button>
        <button id="select-fight" class="btn btn-primary">Fight! ▶</button>
      </div>
    </div>

    <!-- BATTLE (HUD) -->
    <div id="screen-battle" class="screen">
      <div id="plane-name" class="plate">
        <i class="cockade"></i><span id="hud-name">—</span>
      </div>

      <div id="objective" class="plate">
        <span class="obj-label">Enemy Aces</span>
        <span id="enemy-pips" class="pips"></span>
      </div>

      <div id="reticle"></div>
      <div id="hitmarker">✕</div>

      <div id="hud" class="plate riveted">
        <div class="gauge">
          <span class="g-label">Thr</span>
          <b class="g-val"><span id="hud-thr">--</span><em>%</em></b>
        </div>
        <div class="gauge">
          <span class="g-label">Spd</span>
          <b class="g-val"><span id="hud-spd">--</span><em>kph</em></b>
        </div>
        <div class="gauge">
          <span class="g-label">Alt</span>
          <b class="g-val"><span id="hud-alt">--</span><em>m</em></b>
        </div>
        <div class="gauge gauge-guns">
          <span class="g-label">Guns</span>
          <span class="heat"><i id="heat-fill"></i></span>
        </div>
      </div>

      <div id="hint" class="plate">
        <b>W</b><b>S</b><span>Pitch</span>
        <b>A</b><b>D</b><span>Rudder</span>
        <b>←</b><b>→</b><span>Roll</span>
        <b>↑</b><b>↓</b><span>Throttle</span>
        <b>Space</b><span>Fire</span>
      </div>

      <div id="result" class="result">
        <div class="result-plate plate riveted">
          <div id="result-text" class="result-text">—</div>
          <div class="result-actions">
            <button id="result-refly" class="btn btn-primary">Refly</button>
            <button id="result-change" class="btn btn-secondary">Change plane</button>
            <button id="result-title" class="btn btn-secondary">Title</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
